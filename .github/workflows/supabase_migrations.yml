name: Apply Supabase Migrations

on:
  push:
    branches: [master]
    paths:
      - "server/supabase/migrations/**"
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

# Never run two migration pushes at once
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Scoped token for this project only. No database password: the CLI asks the
      # Management API for a short-lived login role instead.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Not a secret (it is in the app's API URL). Must be the project the app calls:
      # composeApp/build.gradle.kts embeds https://axuhfogeovtsbxokqccf.supabase.co as the default.
      SUPABASE_PROJECT_ID: axuhfogeovtsbxokqccf
      # Only needed when linking asks for it; the CLI can do without.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
          fi
        working-directory: server

      # --remote is required: without it the CLI targets a local stack on 127.0.0.1:54322,
      # which is what made every run of this workflow fail before.
      # --yes is required too: the CLI asks "Apply N migrations?" on a terminal, and in Actions
      # stdout is not one, so every run printed the prompt and exited 1 without touching the
      # database. That is why the app kept talking to a schema with no package_votes and no
      # community_comments: the migrations were committed but never applied.
      # --include-all is required as well: two people (or two sessions) adding migrations in
      # parallel produce files whose timestamps fall behind the last applied one, and the CLI
      # refuses those with "Found local migration files to be inserted before the last migration
      # on remote database" — exiting 1 with the migration committed but never applied. That is
      # exactly what happened to 20261121150000_device_name_seed.sql after 170000 landed first.
      - name: Apply migrations
        run: supabase db push --remote --yes --include-all
        working-directory: server
